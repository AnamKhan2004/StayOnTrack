name: Build LaTeX Report

on:
  push:
    branches:
      - main
    paths:
      - 'Progress_LaTeX/**'
      - 'src/outputs/**'
      - '.github/workflows/build-latex.yml'

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: Progress_LaTeX

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-report
          path: Progress_LaTeX/main.pdf

      - name: Commit compiled PDF
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update compiled PDF [skip ci]"
          file_pattern: Progress_LaTeX/main.pdf